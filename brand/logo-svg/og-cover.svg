  <!-- faint plan grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <path d="M80 0V630M240 0V630M400 0V630M560 0V630M720 0V630M880 0V630M1040 0V630"/>
    <path d="M0 90H1200M0 250H1200M0 410H1200M0 540H1200"/>
  </g>
