<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img"
     aria-label="Schematic of a coordinated operating model: planning, facilities, logistics, and program oversight linked on a common framework.">
  <title>Operating model schematic</title>
  <!-- Original plan-view schematic of a coordinated operating model. -->
  <rect width="640" height="480" fill="#F7F5F0"/>

  <!-- Faint modular grid -->
  <g stroke="#141B24" stroke-opacity="0.06" stroke-width="1">
    <path d="M40 0V480M120 0V480M200 0V480M280 0V480M360 0V480M440 0V480M520 0V480M600 0V480"/>
    <path d="M0 40H640M0 120H640M0 200H640M0 280H640M0 360H640M0 440H640"/>
  </g>

  <!-- Common framework / datum -->
  <path d="M56 400 H584" stroke="#141B24" stroke-width="2"/>
  <text x="56" y="424" font-family="'IBM Plex Mono', monospace" font-size="11"
        letter-spacing="2" fill="#6E7F8D">COMMON&#160;OPERATING&#160;FRAMEWORK</text>

  <!-- Facility / node plan blocks -->
  <g stroke="#1F2A36" stroke-width="1.6" fill="none">
    <rect x="88" y="120" width="120" height="88"/>
    <rect x="264" y="72" width="112" height="80"/>
    <rect x="432" y="132" width="120" height="76"/>
  </g>
  <g fill="#1F2A36" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.5">
    <text x="98" y="112">PLAN</text>
    <text x="274" y="64">SUSTAIN</text>
    <text x="442" y="124">OVERSEE</text>
  </g>

  <!-- Orthogonal connecting routes (logistics/coordination) -->
  <g stroke="#B06A2C" stroke-width="1.6" fill="none">
    <path d="M148 208 V320 H320 V152"/>
    <path d="M320 320 H492 V208"/>
  </g>

  <!-- Junction + station nodes -->
  <g>
    <circle cx="148" cy="320" r="5" fill="#141B24"/>
    <circle cx="320" cy="320" r="6" fill="#B06A2C"/>
    <circle cx="492" cy="320" r="5" fill="#141B24"/>
    <circle cx="320" cy="152" r="5" fill="#141B24"/>
  </g>

  <!-- Coordinate ticks on framework -->
  <g stroke="#6E7F8D" stroke-width="1">
    <path d="M148 400 v10 M320 400 v10 M492 400 v10"/>
  </g>
</svg>
